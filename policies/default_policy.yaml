# ============================================================
# Default Policy
# Every action an agent wants to take is checked against this
# file BEFORE it runs. Deny rules always beat allow rules.
# ============================================================

# Tools the agent is permitted to call at all.
allowed_tools:
  - read_file
  - write_file
  - list_files
  - web_search_stub

# Tools that are always blocked, even if an agent asks nicely.
denied_tools:
  - shell_exec
  - delete_file
  - network_raw

# File path rules (checked in order; first match wins).
# "workspace" means anything inside config.workspace_dir.
file_rules:
  - path: "workspace/**"
    read: allow
    write: allow
  - path: "**"          # everything else
    read: deny
    write: deny

# Simple content rules: if the agent's proposed action text matches
# any of these (case-insensitive substring), it's blocked and logged.
denied_content_patterns:
  - "rm -rf"
  - "format c:"
  - "api_key"
  - "password"

# Rate limits per run
limits:
  max_tool_calls_per_run: 40
  max_file_writes_per_run: 10
  max_bytes_per_write: 2000000   # ~2MB

# What to do when a rule is violated: "block" (stop that action,
# tell the agent why, let it try something else) or "abort" (kill
# the whole run immediately).
on_violation: block
