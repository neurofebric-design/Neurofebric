# ============================================================
# Agent Harness — global settings
# ============================================================

# Which LLM backend to use:
#   "omniroute" - self-hosted gateway, 200+ providers, many free tiers (recommended, no budget needed)
#   "ollama"    - fully local, free, needs a beefy-ish laptop
#   "anthropic" - Claude API directly, needs a paid API key
llm_backend: omniroute

omniroute:
  base_url: "http://localhost:20128"   # default when running `omniroute` locally
  model: "auto"    # or pick a specific free-tier model, e.g. "auto/coding:cheap"
  # If your OmniRoute instance requires a key, set it as an env var instead
  # of writing it here:  setx OMNIROUTE_API_KEY "..."

ollama:
  base_url: "http://localhost:11434"
  model: "llama3.1:8b"     # pull with: ollama pull llama3.1:8b

anthropic:
  # Set your key as an environment variable instead of writing it here:
  #   setx ANTHROPIC_API_KEY "sk-ant-..."
  model: "claude-sonnet-4-6"
  max_tokens: 2000

# Directory agents are sandboxed to. Nothing outside this folder
# can be read or written by any tool, no matter what the agent asks.
workspace_dir: "./workspace"

# Max reasoning/tool-call loops before an agent is forced to stop.
# Prevents runaway loops and runaway API/compute cost.
max_steps_per_run: 25

# Which policy file governs this run
policy_file: "./policies/default_policy.yaml"
